name: BubblePhysicsBench
schemes:
  BubblePhysicsBench:
    build:
      targets:
        BubblePhysicsBench: all
    run:
      config: Release
    archive:
      config: Release
options:
  bundleIdPrefix: com.example
packages:
  BubblePhysics:
    path: ../../..
targets:
  BubblePhysicsBench:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
    dependencies:
      - package: BubblePhysics
        product: BubblePhysics
      - package: BubblePhysics
        product: BubblePhysicsMetalRender
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
