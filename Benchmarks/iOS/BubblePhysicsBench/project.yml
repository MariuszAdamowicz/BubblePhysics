name: BubblePhysicsBench
schemes:
  BubblePhysicsBench:
    build:
      targets:
        BubblePhysicsBench: all
    run:
      config: Release
    archive:
      config: Release
options:
  bundleIdPrefix: com.mariuszadamowicz
packages:
  BubblePhysics:
    path: ../../..
targets:
  BubblePhysicsBench:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
        excludes:
          - RadialBubblePrototypeView.swift
    dependencies:
      - package: BubblePhysics
        product: BubblePhysicsBenchmarkSupport
      - package: BubblePhysics
        product: BubblePhysics
      - package: BubblePhysics
        product: BubblePhysicsMetalRender
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mariuszadamowicz.BubblePhysicsBench
        DEVELOPMENT_TEAM: T8K3TYUY9D
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
