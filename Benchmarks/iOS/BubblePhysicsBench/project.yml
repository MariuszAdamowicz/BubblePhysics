name: BubblePhysicsBench
options:
  bundleIdPrefix: com.mariuszadamowicz
packages:
  BubblePhysics:
    path: ../../..
targets:
  BubblePhysicsBench:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - App
    dependencies:
      - package: BubblePhysics
        product: BubblePhysics
      - package: BubblePhysics
        product: BubblePhysicsMetal
      - package: BubblePhysics
        product: BubblePhysicsReference
      - package: BubblePhysics
        product: BubblePhysicsReferenceMetal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mariuszadamowicz.BubblePhysicsBench
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
